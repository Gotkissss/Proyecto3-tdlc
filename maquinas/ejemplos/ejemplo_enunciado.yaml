# Ejemplo tomado tal cual del enunciado del proyecto.
#   δ([q0, B], a) = ([q1, a], B, R)
#   δ([q0, B], b) = ([q1, b], B, R)
# Sirve para comprobar que el parser respeta el formato read/write con memoria.
# Como q1 no tiene transiciones, todas las cadenas se rechazan en el paso 1.
mt:
  states: [q0, q1, q2, qf]
  input_alphabet: [a, b]
  tape_alphabet: [a, b, B, X, Y]
  initial_state: q0
  accept_states: [qf]
  transitions:
    - state: q0
      read: [a, B]
      write: [a, B]
      move: R
      next: q1
    - state: q0
      read: [b, B]
      write: [b, B]
      move: R
      next: q1
  inputs:
    - "aabb"
    - "ab"
    - "aaabbb"
