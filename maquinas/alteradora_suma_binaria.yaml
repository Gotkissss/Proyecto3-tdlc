# MT ALTERADORA: suma binaria   x+y  ->  x + y   (x, y ∈ {0,1}+)
#
# Ejemplo: "1011+110" (11 + 6) deja en la cinta "10001" (17).
#
# Idea: mientras y != 0, decrementar y en 1 e incrementar x en 1.
#   q0..q3   validan que la entrada tenga la forma x+y y llevan el cabezal al final de y.
#   dec      resta 1 a y en binario (0→1 con préstamo hacia la izquierda, 1→0 termina).
#            Si el préstamo llega hasta '+', y valía 0: hay que limpiar.
#   back     regresa hasta '+'.
#   inc      suma 1 a x (1→0 con acarreo, 0→1 termina; si el acarreo se sale por
#            la izquierda escribe un 1 nuevo: x crece una posición).
#   fwd      vuelve al final de y para el siguiente decremento.
#   clean    borra '+' y lo que queda de y (todos 1s tras el último préstamo).
#   home     regresa el cabezal al inicio del resultado y acepta en qf.
#
# Una entrada mal formada (p.ej. "+1", "1+", "1+1+1") no tiene transición y se rechaza.
mt:
  name: "Alteradora suma binaria"
  description: "Transforma x+y (binario) en el número binario x+y. Ej.: 1011+110 -> 10001."
  states: [q0, q1, q2, q3, dec, back, inc, fwd, clean, home, home2, qf]
  input_alphabet: ["0", "1", "+"]
  tape_alphabet: ["0", "1", "+", B]
  initial_state: q0
  accept_states: [qf]
  transitions:
    # ---------- Validación de la forma x+y ----------
    - {state: q0, read: ["0", B], write: [B, "0"], move: R, next: q1}
    - {state: q0, read: ["1", B], write: [B, "1"], move: R, next: q1}
    - {state: q1, read: ["0", B], write: [B, "0"], move: R, next: q1}
    - {state: q1, read: ["1", B], write: [B, "1"], move: R, next: q1}
    - {state: q1, read: ["+", B], write: [B, "+"], move: R, next: q2}
    - {state: q2, read: ["0", B], write: [B, "0"], move: R, next: q3}
    - {state: q2, read: ["1", B], write: [B, "1"], move: R, next: q3}
    - {state: q3, read: ["0", B], write: [B, "0"], move: R, next: q3}
    - {state: q3, read: ["1", B], write: [B, "1"], move: R, next: q3}
    - {state: q3, read: [B, B],   write: [B, B],   move: L, next: dec}
    # ---------- dec: y := y - 1 ----------
    - {state: dec, read: ["0", B], write: [B, "1"], move: L, next: dec}
    - {state: dec, read: ["1", B], write: [B, "0"], move: L, next: back}
    - {state: dec, read: ["+", B], write: [B, B],   move: R, next: clean}
    # ---------- back: regresar a '+' ----------
    - {state: back, read: ["0", B], write: [B, "0"], move: L, next: back}
    - {state: back, read: ["1", B], write: [B, "1"], move: L, next: back}
    - {state: back, read: ["+", B], write: [B, "+"], move: L, next: inc}
    # ---------- inc: x := x + 1 ----------
    - {state: inc, read: ["1", B], write: [B, "0"], move: L, next: inc}
    - {state: inc, read: ["0", B], write: [B, "1"], move: R, next: fwd}
    - {state: inc, read: [B, B],   write: [B, "1"], move: R, next: fwd}
    # ---------- fwd: ir al final de y ----------
    - {state: fwd, read: ["0", B], write: [B, "0"], move: R, next: fwd}
    - {state: fwd, read: ["1", B], write: [B, "1"], move: R, next: fwd}
    - {state: fwd, read: ["+", B], write: [B, "+"], move: R, next: fwd}
    - {state: fwd, read: [B, B],   write: [B, B],   move: L, next: dec}
    # ---------- clean: borrar y ----------
    - {state: clean, read: ["0", B], write: [B, B], move: R, next: clean}
    - {state: clean, read: ["1", B], write: [B, B], move: R, next: clean}
    - {state: clean, read: [B, B],   write: [B, B], move: L, next: home}
    # ---------- home: regresar al inicio del resultado ----------
    - {state: home,  read: [B, B],   write: [B, B],   move: L, next: home}
    - {state: home,  read: ["0", B], write: [B, "0"], move: L, next: home2}
    - {state: home,  read: ["1", B], write: [B, "1"], move: L, next: home2}
    - {state: home2, read: ["0", B], write: [B, "0"], move: L, next: home2}
    - {state: home2, read: ["1", B], write: [B, "1"], move: L, next: home2}
    - {state: home2, read: [B, B],   write: [B, B],   move: R, next: qf}
  inputs:
    - "101+11"      # 5 + 3  = 8   -> 1000
    - "1011+110"    # 11 + 6 = 17  -> 10001
    - "111+111"     # 7 + 7  = 14  -> 1110
    - "1+1111"      # 1 + 15 = 16  -> 10000
    - "1100+0"      # 12 + 0 = 12  -> 1100
